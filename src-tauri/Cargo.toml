[package]
name = "usticky"
version = "0.2.0"
description = "Always-on-top floating sticky note for desktop"
authors = ["Thedeergod666"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "usticky_lib"
# **P3-20 fix**：只用 rlib 就够 —— main.rs `use usticky_lib::run()`，没有
# 外部消费者链接这个 lib。删 staticlib：它当初是为了 MinGW 兜底绕 ld 16-bit
# ordinal 溢出，但 MSVC 是 release CI 主路径（详见 AGENTS.md "发版"段）
# 不需要 staticlib；GNU 上 rlib 也够本 crate 内 run() 链接。少一个 crate-type
# = 少一次链接器选项处理、cargo 调用更简洁。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
# **P2-6 fix**：single-instance 插件 —— 第二次启动 Usticky 时聚焦已有浮窗
# 而不是新开一个进程（macOS 上 dock 图标重复 + 各持一份 store 会触发并发写）。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
rust-i18n = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSEvent", "NSWorkspace", "NSRunningApplication"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindowLevel", "CGGeometry"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# 不开 strip = true —— 跟 rust-i18n 3.x 的 Lazy<HashMap> 存储冲突
# （Windows MSVC 链接器会把 HashMap 字面量 backing 段当 unreferenced 丢掉）